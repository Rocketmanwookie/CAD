name: Quality gates

on:
  pull_request:
  push:
    branches: [controlforgecad]

permissions:
  contents: read

jobs:
  automated-verification:
    name: Automated verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Run regression suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q ControlForgeCAD
      - name: Reject whitespace errors
        run: git diff --check HEAD~1 HEAD
      - name: Reject new critical Ruff errors
        # The project has documented legacy style debt. This deliberately
        # enforces syntax/undefined-name classes now; style rules are ratcheted
        # separately rather than blocking every existing module at once.
        run: ruff check ControlForgeCAD --select E9,F63,F7,F82 --per-file-ignores 'ControlForgeCAD/InitGui.py:F821'
